# Publish the site through the GitHub Pages *Actions* deployer.
#
# The legacy branch builder kept failing on this repo: "Page build failed" with duration 0
# after about ten minutes, twice in three deploys, with no log to look at. The repo is only
# ~18 MB across ~100 files, so size is not the cause — the legacy Jekyll pipeline is simply
# not reliable here, and it offers nothing this site needs (there is no _config.yml, no
# layouts, no Gemfile; .nojekyll is committed).
#
# This uploads the repo as a Pages artifact and deploys it verbatim. It is faster, it cannot
# be tripped up by Jekyll, and when it does fail there is a real log.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; queue instead of cancelling so a push is not silently dropped
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: provenance freshness is the last COMMIT that touched each data
          # file, and a shallow clone cannot see that, so the build would fall back to
          # mtime and tell users their data was refreshed the moment CI checked it out.
          fetch-depth: 0
      # Gate the deploy on the suite. Twice in one day a change shipped that killed the whole
      # application — a corrupted script and a runtime throw — and both reached main because
      # nothing checked the built artifact before it was published. No install step: the suite
      # uses Node's built-in test runner and has no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify the built artifact
        run: npm test
      # Record what was tested and what is being shipped, into the artifact only. The
      # dashboard at /status.html reads this, so it is never staler than the live site.
      - name: Generate the status dashboard data
        run: node transit_data/gen-status.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
