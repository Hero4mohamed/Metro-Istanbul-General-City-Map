name: Refresh accessibility data

# Rebuilds the per-station step-free / elevator data from İBB Open Data (authoritative
# elevator + escalator counts) enriched with OpenStreetMap wheelchair tags, then rebuilds
# the site so the baked-in data + station panels stay current. Monthly is plenty — elevator
# counts change slowly (mostly when new stations open). Also catches OSM when Overpass is
# available (it rate-limits under load), so the wheelchair enrichment lands automatically.

on:
  schedule:
    - cron: '17 4 1 * *'        # 04:17 UTC on the 1st of each month
  workflow_dispatch: {}         # allow manual "Run workflow"

permissions:
  contents: write
  actions:  write               # lets it dispatch pages.yml — see the publish step

concurrency:
  group: accessibility
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # a shallow clone cannot rebase when a push loses a race
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch İBB + OSM accessibility data
        run: node transit_data/fetch-accessibility.cjs
      - name: Rebuild site with refreshed data
        run: node transit_data/build.cjs
      # No [skip ci]: Pages publishes the last artifact uploaded by pages.yml, so a commit that
      # skips CI rebuilds index.html in the repo and never puts it on the live site.
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- transit_data/accessibility.json index.html; then
            echo "No change — accessibility data already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "accessibility-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transit_data/accessibility.json index.html sw.js
          git commit -m "chore: refresh accessibility data + rebuild"
          for attempt in 1 2 3; do
            if git push; then
              echo "Accessibility data refreshed (attempt $attempt)."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::could not push accessibility refresh after 3 attempts"
          exit 1

      # Pushing is not enough. GitHub deliberately does NOT start a workflow from a push made
      # with the default GITHUB_TOKEN, so this job's own commit can never trigger pages.yml.
      # workflow_dispatch is the documented exception, so the publish is asked for explicitly.
      - name: Publish to Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
