name: Tests

# Fast feedback on every push and pull request, independent of deployment. pages.yml runs the
# same suite as a deploy gate; this one exists so a failure is visible on a branch before it
# ever reaches main.
#
# There is no install step and no lockfile: the suite runs on Node's built-in test runner with
# zero dependencies, which keeps it usable offline and immune to registry or TLS problems.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: provenance freshness is the last COMMIT that touched each data
          # file, and a shallow clone cannot see that, so the build would fall back to
          # mtime and tell users their data was refreshed the moment CI checked it out.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The suite reads the COMMITTED index.html, because that is what users receive.
      - name: Suite against the committed build
        run: npm test

      # Then prove the committed build is what the template actually produces. A drift here
      # means someone edited app.template.html and forgot to rebuild, so the tests above just
      # validated a stale artifact.
      - name: The committed build matches the template
        run: |
          # Three values are intentionally different on every build: the diagnostics build stamp,
          # the CSP script hash that necessarily changes with it, and the "updated" time of
          # disruptions.json in the provenance table. The last is the time of the latest commit
          # to that file, and the live-disruptions bot commits it every ~30 minutes without
          # rebuilding index.html, so any merge that lands after a bot commit (and every squash
          # merge, which makes a new commit of its own) rebuilds with a newer time than the one
          # committed. Normalise all three, or this check reports drift after nearly every merge
          # and stops meaning anything. Every other dataset's date is still compared.
          #
          # A fourth thing differs for the same reason: the page carries a baked-in COPY of the live
          # notices (03-data.js: "baked-in fallback; overridden by the live fetch"). The bot, and the
          # laptop that refreshes them while GitHub's servers cannot reach metro.istanbul, change
          # disruptions.json without rebuilding index.html, so that copy is stale by design within
          # hours. It is replaced with a placeholder on both sides; the notices themselves are
          # checked by the suite, which reads disruptions.json directly.
          normalise() {
            sed -E -e 's/const BUILD = "[0-9]+"/const BUILD = "STAMP"/' \
                   -e "s/'sha256-[A-Za-z0-9+\\/=]+'/'sha256-HASH'/g" \
                   -e 's/("disruptions\.json":\{[^}]*"updated":")[^"]*"/\1STAMP"/' \
                   -e 's/^(let DISRUPTIONS = HAS\.disruptions \? ).*$/\1[BAKED-IN NOTICES]/' "$1"
          }
          normalise index.html > /tmp/committed.html
          node transit_data/build.cjs > /dev/null
          normalise index.html > /tmp/rebuilt.html
          if ! diff -q /tmp/committed.html /tmp/rebuilt.html > /dev/null; then
            echo "::error::index.html is not what transit_data/build.cjs produces — run the build and commit the result"
            diff /tmp/committed.html /tmp/rebuilt.html | head -20 || true
            exit 1
          fi
          echo "committed build is current (build stamp and CSP hash normalised)"

      # Finally, prove the suite can still fail. A green suite that no longer detects the
      # defects it was written for is worse than no suite at all.
      - name: The suite still catches known defects
        run: npm run test:mutation
